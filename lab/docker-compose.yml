# Laboratorio local do sistema de chamadas.
#
# Sobe Asterisk + Postgres + Redis + NATS e DUAS pontas SIPp que atendem
# sozinhas. Com isso o fluxo inteiro roda sem operadora, sem softphone humano e
# sem custo: originate da perna A, bridge, originate da perna B pelo `trunk`,
# IN_PROGRESS, gravacao e finalize.
#
# O endpoint chamado `trunk` existe com o MESMO nome de producao, para o worker
# montar exatamente o mesmo PJSIP/<target>@trunk. Trocar o bloco [trunk] do
# pjsip.conf pelo do provedor e o unico passo para o tronco virar externo.
services:
  asterisk:
    image: andrius/asterisk:20
    container_name: lab-asterisk
    # A imagem nao cria /var/spool/asterisk/recording, e e ai que a gravacao de
    # bridge do ARI escreve: sem o diretorio, POST /bridges/<id>/record devolve
    # 500 "No such file or directory". O cdr-csv sofre do mesmo.
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/spool/asterisk/recording /var/log/asterisk/cdr-csv
        chown -R asterisk:asterisk /var/spool/asterisk /var/log/asterisk
        exec asterisk -f -vvv
    volumes:
      - ./asterisk/asterisk.conf:/etc/asterisk/asterisk.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - asterisk-spool:/var/spool/asterisk
    # LIMITE DE FILE DESCRIPTORS — o teto que primeiro aparece.
    #
    # Cada canal com midia consome varios fds (socket RTP + RTCP, por perna). Com
    # o default de 1024 o Asterisk falha em "Unable to allocate RTCP socket: Too
    # many open files" por volta de 118 canais (~59 chamadas) — e a falha NAO
    # aparece como erro de chamada: ela simplesmente nao monta.
    #
    # Vale para producao: la o systemd tem LimitNOFILE=524288, mas o processo
    # roda com SOFT limit de 1024. O teto e o mesmo.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8088:8088"          # ARI (o worker roda fora do compose)
      - "5060:5060/udp"
      # RTP NAO e publicado: ele flui entre Asterisk e SIPp dentro da rede `lab`.
      # Publicar a faixa inteira levaria minutos e nao muda nada — o worker fala
      # ARI (8088), nunca midia.
    networks: [lab]

  # Pontas que atendem sozinhas, com midia real em laco (ver bench/uas-media.xml).
  #
  # OS PCAPS PRECISAM EXISTIR ANTES DO `up`: o SIPp carrega o pcap ao PARSEAR o
  # cenario, nao na hora de tocar. Subir sem eles derruba os tres containers no
  # boot. Gere com:  python3 bench/mkpcap.py
  #
  # SEM `-i`: com `-i 0.0.0.0` o SIPp anuncia 0.0.0.0 no Contact do 200 OK e o
  # ACK do Asterisk vai para lugar nenhum — o SIPp retransmite o 200 nove vezes e
  # aborta por timeout. Sem a flag ele usa o IP real da interface.
  uas-1001:
    image: ctaloi/sipp:latest
    container_name: lab-uas-1001
    command: ["-sf", "/bench/uas-media.xml", "-p", "5061", "-nostdin"]
    volumes: ["./bench:/bench:ro"]
    networks: [lab]

  uas-1002:
    image: ctaloi/sipp:latest
    container_name: lab-uas-1002
    command: ["-sf", "/bench/uas-media.xml", "-p", "5062", "-nostdin"]
    volumes: ["./bench:/bench:ro"]
    networks: [lab]

  # Perna A alternativa, falando SO G.722: e o que da ao benchmark um modo com
  # TRANSCODING de verdade (`MODO=transcode ./bench/bench.sh`). Sem ela os dois
  # lados falam G.711 e o Asterisk fica em passthrough - o cenario barato, e o
  # unico que a primeira rodada mediu.
  uas-1003:
    image: ctaloi/sipp:latest
    container_name: lab-uas-1003
    command: ["-sf", "/bench/uas-media-g722.xml", "-p", "5063", "-nostdin"]
    volumes: ["./bench:/bench:ro"]
    networks: [lab]

  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      retries: 20
    networks: [lab]

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports: ["6380:6379"]
    networks: [lab]

  nats:
    image: nats:2.10-alpine
    container_name: lab-nats
    command: ["-js"]
    ports: ["4224:4222"]
    networks: [lab]

  # LocalStack: o S3 das gravacoes.
  #
  # Fica AQUI, na rede do lab, e nao no docker-compose do call-infra, porque o
  # ponto e o worker gravar de verdade DURANTE o benchmark. Um S3 simulado que
  # so responde a um smoke test isolado nao exercita o caminho que interessa: a
  # gravacao e finalizada pelo Asterisk depois que a bridge cai, baixada pelo
  # ARI com backoff e SO ENTAO subida. O que quebra ali quebra sob carga.
  #
  # Community: s3, iam, sts e ec2. `autoscaling`, `rds` e `elasticache` sao Pro
  # e ficam de fora — o lab ja tem Postgres e Redis DE VERDADE aqui em cima, que
  # testam mais do que o mock testaria.
  #
  # A porta e publicada porque o worker roda FORA do compose: ele fala
  # AWS_ENDPOINT_URL=http://127.0.0.1:4566, do mesmo jeito que fala ARI em 8088.
  #
  # Quem cria o bucket e o Terraform:
  #   cd ../../call-infra && make apply && make smoke
  localstack:
    image: localstack/localstack:3
    container_name: lab-localstack
    environment:
      SERVICES: s3,iam,sts,ec2
      DEBUG: "0"
      PERSISTENCE: "0"
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": *\"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lab]

volumes:
  asterisk-spool:

networks:
  lab:
    name: lab
