[general]
; Faixa larga para o benchmark. Cada CHAMADA usa duas pernas, e cada perna um
; par RTP/RTCP — ou seja ~4 portas por chamada. 10.000 portas = teto de ~2.500
; chamadas simultaneas, bem acima do que esta maquina aguenta.
;
; Em producao esta faixa e o teto RIGIDO de simultaneas do no: a faixa padrao de
; 10.000-20.000 limita a ~2.500 chamadas por Asterisk, independente de CPU.
rtpstart=20000
rtpend=30000
