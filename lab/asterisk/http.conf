; ARI/HTTP. No laboratorio escuta em 0.0.0.0 para o worker (fora do container)
; alcancar. Em producao o bind e 127.0.0.1 e quem publica e o Caddy.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; TETO DE SESSOES HTTP SIMULTANEAS. Estava implicito ate 02/09/2026, e o valor
; herdado era este mesmo: MEDIDO nesta imagem (Asterisk 20.20.1), 100 conexoes
; keep-alive aceitas e a 101a recusada.
;
; Fica explicito porque e um teto COMPARTILHADO e duro: por ele passam o
; WebSocket de eventos do worker, todo o controle de chamadas e o download das
; gravacoes (arquivos de MBs, que seguram a sessao por segundos). Passando do
; teto o Asterisk RECUSA a conexao, e o originate recusado e indistinguivel de
; uma chamada que nao montou por qualquer outro motivo.
;
; O numero e contrato com o worker: ele orca ARI_HTTP_SESSION_LIMIT menos uma
; reserva e nunca abre mais que isso (ver internal/ari.NewTransport). Subir aqui
; sem subir la nao adianta; subir la sem subir aqui vira recusa de conexao.
sessionlimit=100
