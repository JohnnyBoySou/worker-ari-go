; Laboratorio. As pontas NAO se registram: cada uma tem contato ESTATICO
; apontando para um SIPp que atende sozinho. Isso torna o teste reproduzivel e
; sem softphone humano no meio.
[global]
type=global
user_agent=Asterisk-lab

; PORTA 5080, nao 5060. O 5060 deste host agora e do Kamailio, que fica na
; BORDA (telefones) e entrega aqui pelo lado interno. E a mesma topologia do VPS
; de producao: Kamailio publico em :5060, Asterisk atras em :5080.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080

; ---------------------------------------------------------------------------
; 1001 = "vendedor" (perna A). O worker origina PJSIP/1001.
; ---------------------------------------------------------------------------
[1001]
type=aor
contact=sip:1001@uas-1001:5061
qualify_frequency=0

[1001]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=1001
; Sem auth: e um contato estatico dentro da rede do compose.
direct_media=no

[1001-identify]
type=identify
endpoint=1001
match=uas-1001

; ---------------------------------------------------------------------------
; 2001 = ramal que REGISTRA, alcancado pelo Kamailio.
;
; A diferenca para 1001/1002/1003 e o que este bloco NAO tem: contato para um
; endereco fixo. O contato aponta para o Kamailio na porta INTERNA (5062), e
; quem sabe onde o telefone esta e a tabela `location`. O worker nao muda nada:
; a perna A e `PJSIP/<sellerSipUsername>`, entao discar 2001 em vez de 1001 ja
; poe a chamada pelo caminho novo.
;
; `qualify_frequency=0`: o alvo do contato e o proxy, nao o aparelho. Um OPTIONS
; daqui responderia sobre a saude do Kamailio e diria nada sobre o telefone --
; quem sabe se ele esta vivo e o registro, que tem expiracao propria.
; ---------------------------------------------------------------------------
[2001]
type=aor
contact=sip:2001@kamailio:5062
qualify_frequency=0

[2001]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=2001
direct_media=no

[kamailio-identify]
type=identify
endpoint=2001
match=kamailio

; ---------------------------------------------------------------------------
; 1003 = MESMO papel do 1001 (perna A), mas falando SO G.722.
;
; Existe para o benchmark ter um modo que FORCA TRANSCODING. Com 1001 os dois
; lados falam G.711 e o Asterisk fica em passthrough; discando 1003 em vez de
; 1001 (`MODO=transcode ./bench/bench.sh`), a perna A vira G.722 e a perna B
; segue em G.711, entao cada sentido paga decodificacao ADPCM, reamostragem e
; recodificacao. Nao muda nada no worker: a perna A e `PJSIP/<sellerSipUsername>`,
; entao o modo e so um campo diferente no corpo do POST.
; ---------------------------------------------------------------------------
[1003]
type=aor
contact=sip:1003@uas-1003:5063
qualify_frequency=0

[1003]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=g722
aors=1003
direct_media=no

[1003-identify]
type=identify
endpoint=1003
match=uas-1003

; ---------------------------------------------------------------------------
; 1002 = "lead" do lado de la. NAO e o tronco real: e o destino local que o
; endpoint `trunk` alcanca, para o fluxo completo rodar sem operadora.
; ---------------------------------------------------------------------------
[1002]
type=aor
contact=sip:1002@uas-1002:5062
qualify_frequency=0

[1002]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=1002
direct_media=no

[1002-identify]
type=identify
endpoint=1002
match=uas-1002

; ---------------------------------------------------------------------------
; trunk = MESMO NOME do endpoint de producao (SIP_TRUNK_ENDPOINT=trunk), para o
; worker montar exatamente o mesmo `PJSIP/<target>@trunk` que monta la. Aqui ele
; entrega no uas-1002 em vez de sair para a operadora.
;
; Trocar este bloco pelo do provedor e o unico passo para o tronco virar externo.
; ---------------------------------------------------------------------------
[trunk]
type=aor
contact=sip:uas-1002:5062
qualify_frequency=0

[trunk]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=trunk
from_user=5541999999999
direct_media=no
