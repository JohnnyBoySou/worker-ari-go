; Laboratorio. As pontas NAO se registram: cada uma tem contato ESTATICO
; apontando para um SIPp que atende sozinho. Isso torna o teste reproduzivel e
; sem softphone humano no meio.
[global]
type=global
user_agent=Asterisk-lab

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------------
; 1001 = "vendedor" (perna A). O worker origina PJSIP/1001.
; ---------------------------------------------------------------------------
[1001]
type=aor
contact=sip:1001@uas-1001:5061
qualify_frequency=0

[1001]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=1001
; Sem auth: e um contato estatico dentro da rede do compose.
direct_media=no

[1001-identify]
type=identify
endpoint=1001
match=uas-1001

; ---------------------------------------------------------------------------
; 1002 = "lead" do lado de la. NAO e o tronco real: e o destino local que o
; endpoint `trunk` alcanca, para o fluxo completo rodar sem operadora.
; ---------------------------------------------------------------------------
[1002]
type=aor
contact=sip:1002@uas-1002:5062
qualify_frequency=0

[1002]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=1002
direct_media=no

[1002-identify]
type=identify
endpoint=1002
match=uas-1002

; ---------------------------------------------------------------------------
; trunk = MESMO NOME do endpoint de producao (SIP_TRUNK_ENDPOINT=trunk), para o
; worker montar exatamente o mesmo `PJSIP/<target>@trunk` que monta la. Aqui ele
; entrega no uas-1002 em vez de sair para a operadora.
;
; Trocar este bloco pelo do provedor e o unico passo para o tronco virar externo.
; ---------------------------------------------------------------------------
[trunk]
type=aor
contact=sip:uas-1002:5062
qualify_frequency=0

[trunk]
type=endpoint
transport=transport-udp
context=connect-lab
disallow=all
allow=ulaw
allow=alaw
aors=trunk
from_user=5541999999999
direct_media=no
