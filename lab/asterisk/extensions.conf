[general]
static=yes
writeprotect=no

; Contexto do worker: tudo que cai aqui vira evento Stasis. O nome casa com
; ASTERISK_ARI_APP + SHARD_ID do worker (connect + lab = connect-lab).
[connect-lab]
exten => _.,1,NoOp(Stasis connect-lab -> ${EXTEN})
 same => n,Stasis(connect-lab)
 same => n,Hangup()

exten => s,1,NoOp(Stasis connect-lab (s))
 same => n,Stasis(connect-lab)
 same => n,Hangup()
