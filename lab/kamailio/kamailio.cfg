#!KAMAILIO
#
# Kamailio do laboratorio: REGISTRAR e LOCATION SERVICE na frente do Asterisk.
#
# POR QUE ELE EXISTE
#   Sem proxy, cada ramal registra DIRETO num Asterisk, e o furo de NAT que o
#   REGISTER abriu pertence AQUELE no. Com `ps_contacts` compartilhado entre nos
#   -- que e como o `worker-asterisk` configura o realtime hoje -- o no B le o
#   contato de um telefone que registrou no no A e manda INVITE para um caminho
#   de volta que so o A tem. Este e o problema que um proxy resolve, e por isso
#   ele precisa existir ANTES do segundo no: depois de ~190 telefones apontados
#   direto para o Asterisk, po-lo na frente significa reapontar todos.
#
# DUAS PORTAS, DE PROPOSITO
#   5060 = borda. E onde os telefones falam. So aqui se aceita REGISTER.
#   5062 = interno. E onde o Asterisk falam. Em producao, 127.0.0.1:5062.
#
#   A direcao da chamada e decidida pela PORTA em que ela chegou, nao pelo IP de
#   origem. IP de origem exigiria resolver o nome do Asterisk no parse da config
#   e reiniciar o Kamailio toda vez que o container troca de IP; a porta e
#   deterministica e nao depende de DNS nem de topologia.
#
# O QUE ELE NAO FAZ (decidido, nao esquecido)
#   Nao distribui entrada (dispatcher) e nao fala com o tronco. A saida continua
#   indo direto do Asterisk para o SBC do provedor. O escopo aqui e registrar e
#   location service.

#!define DBURL "postgres://lab:lab@postgres:5432/lab"
#!define ASTERISK "sip:asterisk:5080"
#!define PORTA_INTERNA 5062
#!define FLAG_NAT 6

####### Global #######
debug=2
log_stderror=yes
memdbg=5
memlog=5
fork=yes
children=4

# `auto_aliases=no` + alias explicito: sem isso o Kamailio adota como dominio
# local tudo que o DNS reverso devolver, e um PTR errado faria `is_myself()`
# responder sim para dominio de terceiro.
auto_aliases=no
alias="lab.local"

listen=udp:0.0.0.0:5060
listen=udp:0.0.0.0:5062

####### Modulos #######
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"

####### Parametros #######

# db_mode 3 = DB_ONLY: a localizacao NAO fica em memoria, so no Postgres. E o
# ponto inteiro do exercicio -- em DB_ONLY a tabela `location` e a fonte da
# verdade, entao outro no le a mesma coisa sem replicacao e sem cache para
# ficar velho. Custa uma ida ao banco por lookup.
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 3)
modparam("usrloc", "use_domain", 0)
# O bflag de NAT precisa ser DECLARADO aqui, e nao so setado no roteamento: e o
# usrloc que persiste o flag junto do contato, e e dele que o nathelper le para
# saber em quem mandar keepalive. Sem esta linha o Kamailio nem sobe --
# "ping_nated_only enabled, but no nat bflag set in usrloc module".
modparam("usrloc", "nat_bflag", FLAG_NAT)

# SOBRE O PATH, QUE E ONDE A INTUICAO ERRA.
#
# O plano era gravar um Path proprio em cada REGISTER, para o location dizer por
# qual proxy se chega naquele contato -- e assim um segundo no alcancar um
# telefone registrado no primeiro. Foi implementado com `add_path_received()` e
# MEDIDO: nao funciona, e nao e bug de configuracao.
#
#   REGISTER 2001: supported=[path] path=[<null>]
#
# O `add_path_received()` insere o Path na copia que vai ser RELAYADA. Quando o
# proprio Kamailio e o registrar, nao ha relay: o `save()` le os headers da
# mensagem recebida, onde o Path que acabamos de inserir nao existe. A funcao
# serve a um proxy de BORDA que encaminha o REGISTER para um registrar separado.
#
# Consequencia arquitetural, que vale mais que a linha de config: com um
# Kamailio por no, cada um sendo seu proprio registrar sobre a MESMA tabela, o
# no B enxerga o contato do telefone registrado no A e nao sabe que precisa
# passar pelo A. A topologia que funciona hoje e UM Kamailio na borda para N
# Asterisks -- que e exatamente a que este lab monta. Se um dia cada no ganhar o
# seu, o desenho tem de virar borda + registrar central, e ai o Path passa a ser
# gravado porque passa a haver relay.
#
# path_mode fica em 1 (lazy): guarda o Path que um proxy A MONTANTE tenha
# inserido, sem exigir que o telefone anuncie `Supported: path` -- o modo 2
# recusaria aparelho antigo. Hoje nao ha ninguem a montante; a linha existe para
# o dia em que houver.
modparam("registrar", "path_mode", 1)
modparam("registrar", "path_use_received", 1)
modparam("registrar", "max_expires", 300)
modparam("registrar", "default_expires", 120)

modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "use_domain", 0)

modparam("rr", "append_fromtag", 0)

# O `received_avp` e o combinado entre os DOIS modulos: o nathelper escreve nele
# o endereco real de onde o REGISTER veio, e o registrar le dali para gravar na
# coluna `received` do location. Se so um dos dois souber o nome do AVP, o
# Kamailio nem sobe -- e se subisse, o endereco real se perderia entre um e
# outro e o location voltaria a guardar o IP privado que o telefone anunciou.
modparam("registrar|nathelper", "received_avp", "$avp(RECEIVED)")

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_from", "sip:pinger@lab.local")

modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")

####### Roteamento #######

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "sanity recusou $rm de $si\n");
        exit;
    }

    # Em dialogo: segue o Record-Route que montamos na chamada inicial.
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                rtpengine_delete();
            } else if (is_method("INVITE")) {
                record_route();
                rtpengine_manage();
            }
            route(RELAY);
        } else if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
            }
        } else {
            sl_send_reply("404", "sem dialogo");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if ($Rp == PORTA_INTERNA) {
        route(PARA_TELEFONE);
    } else {
        route(PARA_ASTERISK);
    }
}

# REGISTER: so na borda, sempre autenticado, sempre com Path.
route[REGISTRAR] {
    if ($Rp == PORTA_INTERNA) {
        sl_send_reply("403", "REGISTER nao se aceita no lado interno");
        exit;
    }
    if (nat_uac_test("19")) {
        # Reescreve o Contact para o endereco de onde o pacote REALMENTE veio.
        # Sem isso o location guarda o IP privado que o telefone anunciou, e o
        # INVITE de volta vai para uma rede que nao existe deste lado.
        fix_nated_register();
        setbflag(FLAG_NAT);
    }
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "1");
        exit;
    }
    consume_credentials();
    if (!save("location")) {
        xlog("L_ERR", "save(location) falhou para $fU\n");
        sl_reply_error();
    }
    exit;
}

# Chamada VINDA de um telefone: autentica, ancora a midia e entrega ao Asterisk.
route[PARA_ASTERISK] {
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "1");
        exit;
    }
    consume_credentials();
    if (nat_uac_test("19")) {
        fix_nated_contact();
        setbflag(FLAG_NAT);
    }
    record_route();
    rtpengine_manage("replace-origin replace-session-connection");
    $du = ASTERISK;
    route(RELAY);
}

# Chamada VINDA do Asterisk para um ramal: resolve no location e entrega.
route[PARA_TELEFONE] {
    if (!lookup("location")) {
        # 404 aqui e informacao, nao falha: significa que o ramal nao tem
        # registro vivo. E a resposta que o Asterisk precisa para marcar a
        # chamada, em vez de tocar no vazio ate o timeout.
        xlog("L_INFO", "sem registro para $rU\n");
        t_reply("404", "ramal nao registrado");
        exit;
    }
    record_route();
    rtpengine_manage("replace-origin replace-session-connection");
    route(RELAY);
}

route[RELAY] {
    t_on_reply("RESPOSTA");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[RESPOSTA] {
    if (status =~ "(183)|(2[0-9][0-9])") {
        rtpengine_manage("replace-origin replace-session-connection");
    }
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
}
