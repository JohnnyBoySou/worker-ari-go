[general]
static=yes
writeprotect=no

; Atende e devolve o audio. Echo em vez de Playback: nao depende de arquivo de
; som na imagem, e reflete o RTP que chegou -- entao se o audio atravessou o
; rtpengine nos dois sentidos, o outro lado escuta a si mesmo.
[fone]
exten => _.,1,NoOp(fone recebeu chamada para ${EXTEN})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
