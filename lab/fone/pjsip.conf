; O "telefone" do laboratorio: um Asterisk pequeno que REGISTRA no Kamailio.
;
; Existe porque os ramais 1001/1002/1003 do benchmark tem contato ESTATICO --
; eles nunca registram, entao nunca exercitam o location service. Sem uma ponta
; que de fato mande REGISTER, a tabela `location` fica vazia e o caminho novo
; nao e testado por ninguem.
[global]
type=global
user_agent=lab-fone

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; O REGISTER vai para o Kamailio na porta de BORDA (5060). O dominio e
; lab.local, que e o `alias` do Kamailio e o `domain` da tabela subscriber.
[reg-kamailio]
type=registration
transport=transport-udp
outbound_auth=auth-2001
server_uri=sip:lab.local
client_uri=sip:2001@lab.local
contact_user=2001
outbound_proxy=sip:kamailio:5060\;lr
retry_interval=5
forbidden_retry_interval=30
expiration=120
; Anuncia `Supported: path` no REGISTER. Sem isso o Kamailio em path_mode=1
; (lazy) nao grava o Path, e o location compartilhado perde exatamente a
; informacao que o torna seguro entre nos: por qual proxy se chega neste
; contato.
support_path=yes

[auth-2001]
type=auth
auth_type=userpass
username=2001
password=lab2001

; Para ATENDER o que o Kamailio entrega.
[fone]
type=endpoint
transport=transport-udp
context=fone
disallow=all
allow=ulaw
allow=alaw
direct_media=no

[fone-identify]
type=identify
endpoint=fone
match=kamailio
